version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Only bundle low-risk bumps. Majors arrive as individual PRs so each
      # migration (TS, Tailwind, Jest, Vite, …) can be taken — or declined —
      # deliberately, instead of six breaking changes sharing one red PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Types must track the runtime we actually run (Node 24 LTS in CI + the
      # Docker images). Bump manually together with a Node upgrade.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
    groups:
      # The Kotlin toolchain moves as one unit or not at all: ksp is pinned to
      # the exact Kotlin version (e.g. 2.0.20-1.0.25) and the Compose compiler
      # plugin ships with Kotlin. Bumped singly they always fail, which is how
      # #53/#48/#51/#55 sat red for a month. Grouped, the upgrade at least
      # arrives as one coherent (if still hand-finished) PR.
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "androidx.compose*"
          # AGP belongs here too: KSP calls AGP internals, so a KSP new enough
          # for current Kotlin needs an AGP newer than our pinned 8.5.2
          # (verified — it fails on AndroidComponentsExtension
          # .addKspConfigurations). Note the Gradle wrapper is not a dependabot
          # ecosystem, so it still has to be bumped by hand alongside AGP.
          - "com.android.tools.build*"
          - "com.android.application*"
          - "com.android.library*"
    ignore:
      # These transitively require a kotlin-stdlib newer than the pinned Kotlin
      # compiler can read, so they cannot land until the Kotlin upgrade does.
      # Verified 2026-07-16: coroutines 1.11 / serialization 1.11 pull
      # kotlin-stdlib 2.2.20 (unreadable by Kotlin 2.0.20); sqldelight 2.3.2
      # forces a newer Kotlin Gradle Plugin that rejects the jvmTarget DSL.
      # Drop these ignores as part of the Kotlin migration.
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines*"
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-serialization*"
      - dependency-name: "app.cash.sqldelight*"
