name: Android Release

# Publishes a signed AAB to the Play "internal" testing track on every main
# push, keeping the visible Android version aligned with the deployed product.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Skip until Play service account is configured
        id: guard
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON secret is not set — skipping Play publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-java@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Google has dropped the legacy `tools` package from the SDK repository
      # index (setup-android's default `packages` input) — only
      # platform-tools (adb) is actually needed here.
      - uses: android-actions/setup-android@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          packages: platform-tools

      - name: Decode upload keystore + Play credentials from secrets
        if: steps.guard.outputs.skip != 'true'
        working-directory: android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"

      - name: Compute Android version from the workflow run
        if: steps.guard.outputs.skip != 'true'
        run: |
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 10 ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build + publish AAB to Play (internal)
        if: steps.guard.outputs.skip != 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/play-sa.json
        run: ./gradlew :app:publishReleaseBundle --no-daemon --stacktrace
