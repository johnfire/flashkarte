name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared (server/web import its dist for types)
        run: npm run build --workspace=packages/shared
      - name: Test all workspaces
        run: npm test
      - name: Build server
        run: npm run build --workspace=packages/server
      - name: Build web
        run: npm run build --workspace=packages/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build debug APK + run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

  # Build the app + mcp images and push to GHCR. Only on push to main, after tests.
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/johnfire/flashkarte-app:latest
            ghcr.io/johnfire/flashkarte-app:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/johnfire/flashkarte
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build + push mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          push: true
          tags: |
            ghcr.io/johnfire/flashkarte-mcp:latest
            ghcr.io/johnfire/flashkarte-mcp:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/johnfire/flashkarte
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

  # Pull the freshly-built images on the VPS and restart the stack.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/flashkarte
            git pull --ff-only
            # Log in to GHCR with the workflow's ephemeral token (images are private).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker logout ghcr.io
            docker image prune -f
            echo "Deployed IMAGE_TAG=${IMAGE_TAG}"
