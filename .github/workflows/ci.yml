name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One deploy at a time; newer pushes supersede in-flight ones.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks — detect secrets in commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      # Real Postgres for the migration smoke test — unit tests mock the DB, so
      # without this a syntactically broken migration only surfaces in prod.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashkarte
          POSTGRES_PASSWORD: flashkarte
          POSTGRES_DB: flashkarte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit production dependencies (fail on High/Critical CVEs)
        run: npm audit --omit=dev --audit-level=high
      - name: Build shared (server/web import its dist for types)
        run: npm run build --workspace=packages/shared
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Test all workspaces
        run: npm test
      - name: Build server
        run: npm run build --workspace=packages/server
      - name: Migration smoke test (all migrations against real Postgres)
        run: node packages/server/dist/db/migrate.js
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: flashkarte
          POSTGRES_USER: flashkarte
          POSTGRES_PASSWORD: flashkarte
      - name: Build web
        run: npm run build --workspace=packages/web

  # Real browser against the real server + real Postgres: the account
  # lifecycle (signup → verify → deck → study → 2FA → export → delete) and
  # axe WCAG A/AA checks on the core pages (§9.0, §16).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashkarte
          POSTGRES_PASSWORD: flashkarte
          POSTGRES_DB: flashkarte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build server + web
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/server
          npm run build --workspace=packages/web
          cp -r packages/web/dist packages/server/public
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E + a11y suite
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/.artifacts/test-results
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Build debug APK + run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + test deps
        working-directory: python
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run pytest (includes shared parser parity corpus)
        working-directory: python
        run: pytest -q

  # Build the app + mcp images and push to GHCR. Only on push to main, after tests.
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, security, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ghcr.io/johnfire/flashkarte-app:latest
            ghcr.io/johnfire/flashkarte-app:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/johnfire/flashkarte
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build + push mcp image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          push: true
          tags: |
            ghcr.io/johnfire/flashkarte-mcp:latest
            ghcr.io/johnfire/flashkarte-mcp:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/johnfire/flashkarte
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

  # Pull the freshly-built images on the VPS and restart the stack.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd /opt/flashkarte
            git pull --ff-only
            # Log in to GHCR with the workflow's ephemeral token (images are private).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker logout ghcr.io
            docker image prune -f
            echo "Deployed IMAGE_TAG=${IMAGE_TAG}"
