name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Serialize staging and production releases without cancelling an active deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks — detect secrets in commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    services:
      # Real Postgres for the migration smoke test — unit tests mock the DB, so
      # without this a syntactically broken migration only surfaces in prod.
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: flashkarte
          POSTGRES_PASSWORD: flashkarte
          POSTGRES_DB: flashkarte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production dependencies must be free of High/Critical CVEs. Development
      # dependencies are separately checked by the patched-dependency security
      # tests run by `npm test`; npm audit cannot account for those local patches.
      - name: Audit production dependencies (fail on High/Critical CVEs)
        run: npm audit --omit=dev --audit-level=high
      - name: Build shared (server/web import its dist for types)
        run: npm run build --workspace=packages/shared
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Test all workspaces
        run: npm test
      - name: Validate EU AI Act course review package
        run: |
          python3 docs/courses/eu-ai-act/curriculum_validation.py
          python3 docs/courses/eu-ai-act/article_50_validation.py
          python3 docs/courses/eu-ai-act/lesson_validation.py
          python3 docs/courses/eu-ai-act/article_50_lessons.py --check
          python3 -m unittest discover -s docs/courses/eu-ai-act -p 'test_*.py'
          python3 docs/courses/eu-ai-act/render_review.py --check
          python3 docs/courses/eu-ai-act/article_50_review.py --check
          python3 docs/courses/eu-ai-act/conformity_review.py --check
          python3 docs/courses/eu-ai-act/conformity_lessons.py --check
      - name: Validate GDPR Basics course package
        run: |
          python3 docs/courses/gdpr/curriculum_validation.py
          python3 docs/courses/gdpr/lesson_validation.py
          python3 docs/courses/gdpr/german_validation.py
          python3 -m unittest discover -s docs/courses/gdpr -p 'test_*.py'
      - name: Build server
        run: npm run build --workspace=packages/server
      - name: Migration smoke test (all migrations against real Postgres)
        run: node packages/server/dist/db/migrate.js
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: flashkarte_test
          POSTGRES_USER: flashkarte
          POSTGRES_PASSWORD: flashkarte
      - name: Study integration tests (real Postgres)
        run: npm run test:integration --workspace=packages/server
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: flashkarte_test
          POSTGRES_USER: flashkarte
          POSTGRES_PASSWORD: flashkarte
      - name: Build web
        run: npm run build --workspace=packages/web

  # Real browser against the real server + real Postgres: the account
  # lifecycle (signup → verify → deck → study → 2FA → export → delete) and
  # axe WCAG A/AA checks on the core pages (§9.0, §16).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: flashkarte
          POSTGRES_PASSWORD: flashkarte
          POSTGRES_DB: flashkarte
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build server + web
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/server
          npm run build --workspace=packages/web
          cp -r packages/web/dist packages/server/public
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E + a11y suite
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: e2e/.artifacts/test-results
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Google has dropped the legacy `tools` package from the SDK repository
      # index (setup-android's default `packages` input) — only platform-tools
      # (adb) is actually needed here; Gradle/AGP fetch their own SDK
      # components via the license acceptance this action also does.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Build debug APK + run unit tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package + test deps
        working-directory: python
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Run pytest (includes shared parser parity corpus)
        working-directory: python
        run: pytest -q

  # Build the app + mcp images and push to GHCR. Only on push to main, after tests.
  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, security, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push app image
        id: app-image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          build-args: VITE_MCP_URL=/mcp
          push: true
          tags: |
            ghcr.io/johnfire/flashkarte-app:latest
            ghcr.io/johnfire/flashkarte-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/johnfire/flashkarte
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build + push mcp image
        id: mcp-image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mcp
          push: true
          tags: |
            ghcr.io/johnfire/flashkarte-mcp:latest
            ghcr.io/johnfire/flashkarte-mcp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/johnfire/flashkarte
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
      - name: Smoke test MCP image imports
        run: |
          docker pull ghcr.io/johnfire/flashkarte-mcp:${{ github.sha }}
          docker run --rm --entrypoint node ghcr.io/johnfire/flashkarte-mcp:${{ github.sha }} -e "require('./dist/tools/decks')"

      - name: Package release with immutable image references
        env:
          APP_DIGEST: ${{ steps.app-image.outputs.digest }}
          MCP_DIGEST: ${{ steps.mcp-image.outputs.digest }}
        run: |
          bash scripts/release/bundle.sh "$RUNNER_TEMP/learnwohl-release.tgz" \
            "ghcr.io/johnfire/flashkarte-app@$APP_DIGEST" "ghcr.io/johnfire/flashkarte-mcp@$MCP_DIGEST"

      - uses: actions/upload-artifact@v7
        with:
          name: learnwohl-release
          path: ${{ runner.temp }}/learnwohl-release.tgz
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  deploy:
    name: Stage, test, and release LearnWohl
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v7
        with:
          name: learnwohl-release
          path: ${{ runner.temp }}

      - name: Upload release to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          [[ "$VPS_HOST" =~ ^[[:alnum:].-]+$ ]]
          [[ "$VPS_USER" =~ ^[[:alnum:]_-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY:?}" > ~/.ssh/learnwohl-deploy-key
          printf '%s\n' "${VPS_HOST_KEY:?}" > ~/.ssh/learnwohl-known-hosts
          cat > ~/.ssh/learnwohl-deploy-config <<CONFIG
          Host learnwohl-vps
              HostName $VPS_HOST
              User $VPS_USER
              Port $VPS_PORT
              BatchMode yes
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/learnwohl-known-hosts
              IdentityFile ~/.ssh/learnwohl-deploy-key
              IdentitiesOnly yes
          CONFIG
          bundle="$RUNNER_TEMP/learnwohl-release.tgz"
          digest="$(sha256sum "$bundle" | cut -d' ' -f1)"
          scp -F ~/.ssh/learnwohl-deploy-config "$bundle" "learnwohl-vps:/opt/learnwohl-releases/$digest.tgz"
          scp -F ~/.ssh/learnwohl-deploy-config scripts/release/deploy.sh "learnwohl-vps:/opt/learnwohl-releases/$digest-deploy.sh"
          printf 'LEARNWOHL_RELEASE_DIGEST=%s\n' "$digest" >> "$GITHUB_ENV"

      - name: Deploy staging
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/release/deploy-from-ci.sh staging

      - name: Install staging browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Gate production on live staging tests
        env:
          STAGING_TLS_CERT: ${{ secrets.STAGING_TLS_CERT }}
          STAGING_TLS_KEY: ${{ secrets.STAGING_TLS_KEY }}
        run: LEARNWOHL_DEPLOY_SSH_CONFIG="$HOME/.ssh/learnwohl-deploy-config" npm run test:staging

      - name: Deploy the same bundle to production
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/release/deploy-from-ci.sh production

      - name: Verify production health and MCP
        run: bash scripts/release/verify.sh production

      - name: Upload staging traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: staging-playwright-traces
          path: e2e/.artifacts/staging-results
          if-no-files-found: ignore
          retention-days: 7
