name: Purge expired app bug reports

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to delete immediately for a verified erasure request"
        required: false
        type: string

permissions:
  issues: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${{ inputs.issue_number }}" ]; then
            gh api --method DELETE "repos/$REPOSITORY/issues/${{ inputs.issue_number }}"
            exit 0
          fi
          cutoff=$(date --utc --date='90 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --repo "$REPOSITORY" --state all --label from-app --limit 1000 --json number,createdAt --jq '.[] | select(.createdAt < "'"$cutoff"'") | .number' | while read -r issue_number; do
            gh api --method DELETE "repos/$REPOSITORY/issues/$issue_number"
          done
