<VirtualHost 82.165.32.162:443>
    ServerName staging.learnwohl.app
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/staging.learnwohl.app/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.learnwohl.app/privkey.pem
    SSLCACertificateFile /etc/apache2/learnwohl-staging-client-ca.pem
    SSLVerifyClient require
    SSLStrictSNIVHostCheck on
    SSLVerifyDepth 1

    Header always set X-Robots-Tag "noindex, nofollow"
    Header always add Content-Security-Policy "connect-src 'self'; frame-src 'none'"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /.well-known/oauth-protected-resource http://127.0.0.1:8107/.well-known/oauth-protected-resource
    ProxyPassReverse /.well-known/oauth-protected-resource http://127.0.0.1:8107/.well-known/oauth-protected-resource
    ProxyPass /.well-known/oauth-authorization-server http://127.0.0.1:8107/.well-known/oauth-authorization-server
    ProxyPassReverse /.well-known/oauth-authorization-server http://127.0.0.1:8107/.well-known/oauth-authorization-server
    ProxyPass /oauth/ http://127.0.0.1:8107/oauth/
    ProxyPassReverse /oauth/ http://127.0.0.1:8107/oauth/
    ProxyPass /mcp http://127.0.0.1:8107/mcp
    ProxyPassReverse /mcp http://127.0.0.1:8107/mcp
    ProxyPass / http://127.0.0.1:8106/ retry=0
    ProxyPassReverse / http://127.0.0.1:8106/
</VirtualHost>
