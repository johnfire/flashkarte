# Production stack for the VPS. Unlike docker-compose.yml (which builds images
# locally), this pulls pre-built images from GHCR — CI builds + pushes them, the
# VPS only pulls. IMAGE_TAG is set by the deploy job to the commit SHA (defaults
# to "latest" for manual runs), so deploys are precise and rollbackable.
services:
  app:
    image: ghcr.io/johnfire/flashkarte-app:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - PORT=3001
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=flashkarte
      - POSTGRES_USER=flashkarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=https://${NGINX_HOST}
      - LOG_DIR=/logs
      # Email (verification + password reset). No-ops if MAIL_HOST is unset.
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - APP_URL=${APP_URL:-https://${NGINX_HOST}}
      # Comma-separated emails auto-promoted to admin on startup (#19).
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:3001"
    volumes:
      - ${FLASHKARTE_LOG_PATH:-./logs}:/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    image: ghcr.io/johnfire/flashkarte-mcp:${IMAGE_TAG:-latest}
    environment:
      - NODE_ENV=production
      - MCP_PORT=3002
      - FLASHKARTE_API_URL=http://app:3001
    ports:
      - "127.0.0.1:${MCP_PORT:-8091}:3002"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=flashkarte
      - POSTGRES_USER=flashkarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - flashkarte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashkarte"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=flashkarte
      - POSTGRES_USER=flashkarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=--clean --if-exists
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=3
      - TZ=${TZ:-UTC}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flashkarte_pgdata:
