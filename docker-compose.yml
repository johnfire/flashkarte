services:
  app:
    build:
      context: .
      target: production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=flashkarte
      - POSTGRES_USER=flashkarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - TWO_FACTOR_SECRET_KEY=${TWO_FACTOR_SECRET_KEY}
      - CORS_ORIGIN=https://${NGINX_HOST}
      - LOG_DIR=/logs
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_FROM=${MAIL_FROM:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PRICE_MONTHLY=${STRIPE_PRICE_MONTHLY:-}
      - STRIPE_PRICE_YEARLY=${STRIPE_PRICE_YEARLY:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-}
      - STRIPE_PORTAL_RETURN_URL=${STRIPE_PORTAL_RETURN_URL:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - GOOGLE_PLAY_PACKAGE_NAME=${GOOGLE_PLAY_PACKAGE_NAME:-}
      - GOOGLE_PLAY_SERVICE_ACCOUNT_FILE=${GOOGLE_PLAY_SERVICE_ACCOUNT_FILE:-}
      - GOOGLE_PLAY_MONTHLY_BASE_PLAN_ID=${GOOGLE_PLAY_MONTHLY_BASE_PLAN_ID:-monthly}
      - GOOGLE_PLAY_YEARLY_BASE_PLAN_ID=${GOOGLE_PLAY_YEARLY_BASE_PLAN_ID:-yearly}
      - GOOGLE_PLAY_RTDN_TOKEN=${GOOGLE_PLAY_RTDN_TOKEN:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:3001"
    volumes:
      - ${FLASHKARTE_LOG_PATH:-./logs}:/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      target: production
    command: ["node", "dist/email-worker.js"]
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=flashkarte
      - POSTGRES_USER=flashkarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_FROM=${MAIL_FROM:-}
      - LOG_DIR=/logs
    volumes:
      - ${FLASHKARTE_LOG_PATH:-./logs}:/logs
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mcp:
    build:
      context: .
      target: mcp
    environment:
      - NODE_ENV=production
      - MCP_PORT=3002
      - FLASHKARTE_API_URL=http://app:3001
      - MCP_STORE_PATH=/data/oauth-store.json
    volumes:
      - mcp_oauth_store:/data
    ports:
      - "127.0.0.1:${MCP_PORT:-8091}:3002"
    depends_on:
      - app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      - POSTGRES_DB=flashkarte
      - POSTGRES_USER=flashkarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - flashkarte_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashkarte"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine@sha256:08e7b70879af45a89305b91f4600cfbc88da2419a65948df870cddb082b8cf83
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=flashkarte
      - POSTGRES_USER=flashkarte
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_EXTRA_OPTS=--clean --if-exists
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=3
      - TZ=${TZ:-UTC}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flashkarte_pgdata:
  mcp_oauth_store:
