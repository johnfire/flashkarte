<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 612" role="img" aria-label="LLM pipeline: text, tokenizer, token IDs, embedding plus position, N transformer blocks, final norm, unembedding to logits, softmax and sampling, next token appended back to the input"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs><rect x="0" y="0" width="440" height="612" fill="white"/><rect x="90" y="10" width="200" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="34.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a">text: "The cat sat"</text><rect x="90" y="76" width="200" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="100.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a">Tokenizer (BPE)</text><rect x="90" y="142" width="200" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="166.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a">Embedding lookup + position</text><rect x="90" y="346" width="200" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="370.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a">Final norm</text><rect x="90" y="412" width="200" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="436.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a">Unembedding  W_U</text><rect x="90" y="478" width="200" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="502.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a">softmax / sampling</text><rect x="90" y="544" width="200" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="568.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1a1a1a">next token</text><rect x="80" y="208" width="220" height="112" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="5 3"/><text x="190" y="227" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Transformer block  × N</text><rect x="100" y="240" width="180" height="30" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="258.85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a">Multi-head attention</text><rect x="100" y="280" width="180" height="30" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.8"/><text x="190.0" y="298.85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#1a1a1a">FFN (+ residuals, norms)</text><line x1="190" y1="50" x2="190" y2="76" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><line x1="190" y1="116" x2="190" y2="142" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><line x1="190" y1="182" x2="190" y2="208" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><line x1="190" y1="320" x2="190" y2="346" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><line x1="190" y1="386" x2="190" y2="412" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><line x1="190" y1="452" x2="190" y2="478" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><line x1="190" y1="518" x2="190" y2="544" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/><text x="202" y="67.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666">n token IDs</text><text x="202" y="133.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666">n × d_model</text><text x="202" y="199.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666">n × d_model</text><text x="202" y="337.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666">n × d_model</text><text x="202" y="403.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666">n × d_model</text><text x="202" y="469.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666">logits: n × V</text><text x="202" y="535.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666">P(next), last row</text><path d="M90,564 L48,564 L48,30 L90,30" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="36" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#666666" transform="rotate(-90 36 300)">append to input, repeat</text></svg>
